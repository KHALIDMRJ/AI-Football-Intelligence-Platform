# Alembic configuration.
#
# The database URL is read at runtime from the PlatformSettings
# (``football_ai.config.platform_settings.database_url``) inside
# ``alembic/env.py``.  The value below is a dummy placeholder to satisfy
# Alembic's parser; ``env.py`` overrides it before any connection opens.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./football_ai.db

# timezone-aware revision timestamps
timezone = UTC

# File template: <seq>_<slug>.py  (zero-padded sequential IDs keep the
# ``alembic/versions/`` folder chronologically readable).
file_template = %%(rev)s_%%(slug)s

# Interpret %% escapes in migration scripts.
truncate_slug_length = 40


[post_write_hooks]
# (empty — no autoformatter hooks for now)


[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
