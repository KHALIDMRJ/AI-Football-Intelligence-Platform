# Model hyperparameter configuration
# These values override the defaults in settings.yaml.
# Edit here without touching application code.

xg:
  type: logistic_regression
  C: 1.0
  max_iter: 1000
  class_weight: balanced
  solver: lbfgs
  calibrate: true          # wrap with CalibratedClassifierCV (isotonic)
  calibration_method: isotonic

p_scores:
  type: xgboost
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.05
  reg_lambda: 1.0
  eval_metric: logloss
  early_stopping_rounds: 20
  scale_pos_weight: null   # set automatically from class imbalance ratio

p_concedes:
  type: xgboost            # mirrors p_scores; can swap to catboost later
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.05
  reg_lambda: 1.0
  eval_metric: logloss
  early_stopping_rounds: 20
  scale_pos_weight: null

xt:
  type: markov
  zones_x: 18
  zones_y: 12
  smoothing: 1.0           # Laplace add-1 smoothing on transition counts

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  stratify: true
  shot_action_types:       # action types used to train the xG model
    - shot
    - header
