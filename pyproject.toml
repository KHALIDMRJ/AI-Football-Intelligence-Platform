[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-platform"
version = "0.1.0"
description = "AI Football Intelligence Platform — tactical analytics powered by VAEP, xG, and xT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Football AI Team" }]

dependencies = [
    # Analytics core (Phase 0 — existing)
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "catboost>=1.2",
    "pydantic[email]>=2.5",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "shap>=0.44",
    "python-multipart>=0.0.9",
    "httpx>=0.26",
    "mplsoccer>=1.2",
    "networkx>=3.2",
    "matplotlib>=3.8",

    # Config / settings (Phase 1)
    "pydantic-settings>=2.1",

    # Database (Phase 2) — async stack; psycopg2 is intentionally NOT pulled in
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # Postgres driver (production)
    "aiosqlite>=0.19",        # SQLite driver (zero-infra dev)
    "greenlet>=3.0",          # required by SQLAlchemy async under CPython

    # Auth (Phase 2)
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Cache / queue (Phase 6)
    "redis>=5.0",
    "arq>=0.25",

    # AI NLP analysis (Phase 5)
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "respx>=0.20",
    "prometheus_client>=0.19",
    "ruff>=0.1",
    "mypy>=1.8",
]

[project.scripts]
football-ai = "football_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["football_ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests with no I/O",
    "integration: exercises the FastAPI app / DB / cache stack end-to-end",
    "slow: > 1s per test; skip locally with '-m \"not slow\"'",
]
filterwarnings = [
    # mplsoccer internally calls fig.set_tight_layout() which is pending-deprecated
    # in matplotlib >= 3.8; we cannot change third-party library code.
    "ignore::PendingDeprecationWarning:mplsoccer",
]

[tool.coverage.run]
source = ["football_ai"]
branch = true
omit = [
    # Streamlit dashboard pages render at import-time via the streamlit runtime;
    # they're tested via smoke tests in test_dashboard, but line coverage is
    # misleading because streamlit's st.* calls short-circuit in headless mode.
    "football_ai/dashboard/app.py",
    "football_ai/dashboard/pages/*",
    # arq worker entry — a config module picked up by `arq football_ai.tasks.worker`.
    # Execution happens in a separate worker process; unit-testing it would
    # amount to asserting that a dict has the keys we just wrote.
    "football_ai/tasks/worker.py",
    # CLI training driver: runs offline against a data dump, not part of the
    # API surface. Covered at integration via the trainers themselves.
    "football_ai/ml/training/match_outcome_trainer.py",
]

[tool.coverage.report]
# Block the release if branch coverage on the API+analytics core slips
# below floor. Note: this is BRANCH coverage (stricter than line coverage)
# so 80% here is a demanding bar — roughly equivalent to 87-90% line-only.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
